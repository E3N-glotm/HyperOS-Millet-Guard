name: Build Magisk module
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in module/*.sh module/bin/*; do sh -n "$f"; done
          sh -n tests/test_reconcile_lock.sh
      - name: Reconcile lock regression
        run: sh tests/test_reconcile_lock.sh
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MilletGuard
          path: dist/*.zip
