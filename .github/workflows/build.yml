name: Build Magisk module
permissions:
  contents: write
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          for f in module/*.sh module/bin/*; do sh -n "$f"; done
          sh -n tests/test_reconcile_lock.sh
          sh -n tests/test_fcm_guard_policy.sh
          sh -n tests/test_scope_boundaries.sh
          sh -n extras/box-for-root/net.inotify
          sh -n tests/test_box_net_inotify_policy.sh
          bash -n tests/test_release_line_endings.sh
      - name: Reconcile lock regression
        run: sh tests/test_reconcile_lock.sh
      - name: FCM DNS recovery regression
        run: sh tests/test_fcm_guard_policy.sh
      - name: Module scope regression
        run: sh tests/test_scope_boundaries.sh
      - name: Box network anti-loop regression
        run: sh tests/test_box_net_inotify_policy.sh
      - name: Build
        run: |
          ./build.sh
          VERSION=$(awk -F= '$1=="version" {print $2}' module/module.prop)
          bash tests/test_release_line_endings.sh "dist/MilletGuard-v${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MilletGuard
          path: dist/*.zip

      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk -F= '$1=="version" {print $2}' module/module.prop)
          TAG="v${VERSION}"
          ZIP="dist/MilletGuard-v${VERSION}.zip"
          NOTES="release-notes/${TAG}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"
          if [ -f "${NOTES}" ]; then
            gh release create "${TAG}" "${ZIP}" --title "Millet Guard ${TAG}" --notes-file "${NOTES}"
          else
            gh release create "${TAG}" "${ZIP}" --title "Millet Guard ${TAG}" --generate-notes
          fi
